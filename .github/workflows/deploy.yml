
name: Stock Simulator CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build Go application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build Go application
        run: go build ./...

      - name: Build Docker image
        run: docker build -t stock-simulator-app:latest .

      - name: Save Docker image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save stock-simulator-app:latest -o stock-simulator-image.tar

      - name: Configure SSH
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy image and Compose file to EC2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            stock-simulator-image.tar \
            "$EC2_USER@$EC2_HOST:/tmp/stock-simulator-image.tar"

          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            docker-compose.yaml \
            "$EC2_USER@$EC2_HOST:$EC2_APP_DIR/docker-compose.yaml"

      - name: Deploy application to EC2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_APP_DIR: ${{ vars.EC2_APP_DIR }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "docker load -i /tmp/stock-simulator-image.tar &&
             cd '$EC2_APP_DIR' &&
             docker compose up -d --no-build --force-recreate app &&
             rm -f /tmp/stock-simulator-image.tar &&
             docker compose ps"
