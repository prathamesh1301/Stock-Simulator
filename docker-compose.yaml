
services:
  redis:
    image: redis:7-alpine
    container_name: redispubsub
    restart: unless-stopped

  app:
    image: stock-simulator-app:latest
    container_name: stock-sim
    env_file:
      - .env
    environment:
      - REDIS_ADDR=redispubsub:6379
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - redis
    restart: unless-stopped
